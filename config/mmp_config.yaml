# MMP Conservative Config v0.1
# Semua angka bisa di-tune tanpa ubah kode.

mode: filter  # mode mesin ini (filter/sniper) — dipakai badge Telegram, bukan logika skor

signal:
  min_confidence: 85        # TIER-1: keyakinan penuh, size penuh
  require_smart_money: true # jika true, skor smart_money=0 => max skor 70-an (auto reject)
  require_kol_or_sm: true   # minimal salah satu dari SM/KOL harus ada
  permissive_confidence: 65 # H2: threshold mode --permissive (testing saja, tak boleh via notify/paper)

tiers:
  # TIER-2: jalur otomatis-penuh-tanpa-KOL. BUKAN pelonggaran veto —
  # veto tetap membunuh semua tier. Risiko dijaga via size 1/2 + paper-wajib.
  tier2_min: 75
  tier2_size_pct: 0.5        # setengah dari paper.risk_pct (0.5% modal)
  tier2_require_dual_source: true  # dua sumber independen harus hadir DAN setuju
  dual_max_divergence: 3.0   # mcap/liq antar-sumber boleh beda max 3x, lebih = konflik
  tier2_evm_tax_required: true  # EVM: tax honeypot.is wajib diketahui

weights:
  # total harus 100
  liquidity_exit: 25
  risk_safety: 25
  token_metrics: 20
  smart_money: 20
  kol: 10

risk:
  # HARD VETO — satu saja terlanggar => REJECT
  min_liquidity_usd: 30000
  min_volume_h24_usd: 50000
  min_txns_h24: 200
  min_holders: 300            # bila data holder tersedia; bila tidak ada data => bukan veto, tapi skor dikurangi
  max_buy_tax_pct: 5
  max_sell_tax_pct: 5
  max_top10_holders_pct: 35   # bila data tersedia
  min_lp_lock_pct: 70         # bila data tersedia
  max_fdv_to_mcap_ratio: 4.0
  min_pair_age_minutes: 60    # tolak token < 1 jam (anti-rug cepat) — kecuali permissive
  blocked_labels: ["honeypot", "mintable-risk", "freezable-risk", "proxy-risk"]
  veto_on_blind: false       # true = buta data keamanan -> VETO (default: penalti+cap saja)
  veto_on_unknown_age: false # true = pair tanpa pairCreatedAt -> VETO AGE_UNKNOWN (default: lolos, umur tak terverifikasi)

liquidity:
  min_liquidity_usd: 30000
  min_volume_to_liquidity_ratio: 1.0  # volume h24 / liquidity >= 1 => ada aktivitas exit
  max_price_impact_1k_pct: 5.0      # order hipotetis $1000 vs likuiditas (proxy kasar, lihat liquidity.py)
  min_dex_count: 1

token_metrics:
  min_price_change_h24_pct: -30   # tolak yang sudah dump parah
  max_price_change_h24_pct: 500   # tolak yang sudah parabolic (FOMO telat)
  min_price_change_h1_pct: -25
  min_volume_h1_usd: 5000

position:
  max_risk_per_trade_pct: 1.0
  default_stop_loss_pct: 15.0
  default_take_profit_pct: 30.0  # RR 1:2
  min_reward_risk: 1.5
  capital_usd: 1000  # L3: modal acuan size nyata (paper). None = size tak dihitung, hanya note

chains:
  # Prioritas: solana selalu diproses & diurutkan duluan.
  # Multi-chain aktif: ethereum, bsc, base, arbitrum tinggal dipakai via --chains.
  enabled: ["solana", "ethereum", "bsc", "base"]
  priority: ["solana", "ethereum", "bsc", "base"]
  per_chain_limit: 10

helius:
  enabled: true            # auto-off bila HELIUS_API_KEY kosong
  timeout_sec: 15
  max_signatures: 100      # batasi RPC calls agar hemat kredit

smart_money_auto:
  # Auto-discovery tanpa list wallet manual. Skor max 85 (tak pernah 100).
  enabled: true
  min_score_to_count: 60   # di bawah ini dianggap "no confluence" untuk cap konservatif
  max_auto_score: 85
  healthy_buy_ratio_min: 0.50
  healthy_buy_ratio_max: 0.70
  max_top_holder_pct: 15.0

tracker:
  # Win-rate tracking: kandidat top holders token PASS tersimpan otomatis.
  enabled: true
  min_trades: 5
  min_win_rate: 0.60
  whale_window_h: 24       # window hitung whale buys per token
  whale_min_sol: 0.5       # buy < ini SOL diabaikan (filter debu); 0 = mati
  watch_wallets: 10        # max wallet dipantau per run whale_watch
  watch_sigs: 20           # max signature per wallet per run

telegram:
  cooldown_min: 120        # anti-spam: 1 pair max 1 alert per 2 jam
  send_summary: true       # kirim ringkasan tiap run bila --notify

dedup:
  cooldown_min: 120        # anti-double-signal: 1 token (chain:address) max 1 baris DB per 2 jam
  # scheduler tiap 60m + boosts itu-itu saja = tanpa ini CSV penuh Stocklana/POLLY tiap jam.
  # Bypass darurat: run_scan --no-dedup / --dedup-min 0

geckoterminal:
  enabled: true            # universe fallback EVM (gratis, tanpa key)

birdeye:
  enabled: true            # auto-off bila BIRDEYE_API_KEY kosong

honeypot_is:
  enabled: true            # tax + honeypot check EVM (gratis, rate-limit ketat)

kol:
  window_hours: 48         # callout lebih tua dari ini tak dihitung
  # skor KOL: 40 + 20 per trusted callout (proven 1.5x, lihat analyzers/kol.py)
  shill_window_hours: 6    # window deteksi shilling terkoordinasi
  shill_min_handles: 3     # >= ini handle berbeda -> skor KOL di-cap
  shill_cap: 30            # cap saat shilling dicurigai

paper:
  risk_pct: 1.0            # risiko virtual per posisi paper
  timeout_h: 72            # posisi OPEN lebih tua dari ini ditutup TIMEOUT saat settle
  slippage_pct: 0.5        # asumsi slippage per sisi untuk liq >= 100k (lihat cost_tiers)
  fee_pct: 0.2             # asumsi fee per sisi
  cost_tiers: [[50000, 2.0], [100000, 1.0]]  # M4: [batas_liq_usd, slip_pct] — token tipis bayar lebih mahal
  # auto-open via: run_scan --paper / scheduler --paper (dedup 1 OPEN per pair)

portfolio:
  # Guard level-portofolio: berlaku untuk paper-open; daily-stop juga blokir alert.
  max_open_positions: 5
  max_per_chain: 2
  daily_stop_pct: -3.0     # % modal (sum pnl_pct*risk_pct/sl_pct); 1x SL T1 (~-1% modal) tak memicu, ~3x SL beruntun memicu
  # Kill switch: buat file data/STOP (atau scripts/killswitch.py --on)

backtest:
  note: "forward-measure entry->live, bukan klaim masa lalu"
  replay_tf: hour             # timeframe candle replay (minute/hour/day)
  replay_limit: 500           # max candle per fetch GeckoTerminal
  min_n_per_bucket: 5        # di bawah ini = EXPLORATORY, bukan kesimpulan

scheduler:
  interval_min: 60

api_budgets:
  # Circuit breaker per run (scheduler = per round, proses baru tiap round).
  # Trip -> collector fail-closed + warning, bukan crash. 0/absen = unlimited.
  helius: 300
  birdeye: 120
  honeypot_is: 80
  geckoterminal: 120
  dexscreener: 600

concurrency:
  # Pool boleh besar; tiap sumber API dibatasi sendiri via semaphore
  # agar tak mempercepat kena rate-limit. 1 = sekuensial (mode lama).
  scan_workers: 4
  universe_workers: 4
  per_source:
    dexscreener: 4
    helius: 3
    birdeye: 2
    honeypot_is: 2
    geckoterminal: 3
