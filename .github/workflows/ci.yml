name: mmp-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q src scripts dashboard
      - run: python -m ruff check src scripts dashboard tests
      - run: python -m mypy src
      - run: python -m pytest tests -q --cov=mmp --cov-report=term-missing --cov-fail-under=75
      - name: secret hygiene (fail bila ada key tertanam)
        run: |
          ! grep -rEn "(BEGIN [A-Z ]*PRIVATE KEY|api[_-]?key['\"]?\s*[:=]\s*['\"][A-Za-z0-9_\-]{16,})" src scripts dashboard config --include="*.py" --include="*.yaml" || (echo "LEAKED SECRET?" && exit 1)
